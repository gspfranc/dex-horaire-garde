services:
  dex:
    build: .
    image: dex-horaire:latest
    container_name: dex-horaire
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Mot de passe du mode edition (a changer !)
      EDIT_PASSWORD: "${EDIT_PASSWORD:-dex}"
      # Cle de session : fixez-la pour garder les sessions apres un redemarrage
      SECRET_KEY: "${SECRET_KEY:-change-moi-en-production}"
      DEX_DATA_DIR: /data
    volumes:
      # Le dossier data/ du projet est monte dans le conteneur : le fichier
      # dex.sqlite3 apparait donc directement a cote des sources, ou vous
      # pouvez le voir, le copier et le sauvegarder.
      #
      # Pour utiliser a la place un volume Docker nomme (gere par Docker, hors
      # du projet), lancez avec DEX_DATA_PATH=dex-data.
      - "${DEX_DATA_PATH:-./data}:/data"

volumes:
  # Declare le volume nomme, pour que DEX_DATA_PATH=dex-data fonctionne.
  dex-data:
